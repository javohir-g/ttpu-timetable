name: Deploy mini app

# Публикует miniapp/ на GitHub Pages и заодно обновляет расписание с edupage.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"     # каждые 6 часов подтягиваем свежее расписание
  workflow_dispatch:           # и кнопка «запустить вручную»

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Тянет актуальную неделю с ttpu.edupage.org и перезаписывает miniapp/data.json.
      # Если edupage недоступен — не валим сборку, публикуем данные из репозитория.
      - name: Обновить расписание
        continue-on-error: true
        run: python miniapp/build_data.py

      # В публикацию кладём только сам сайт, без скрипта сборки
      - name: Собрать папку сайта
        run: |
          mkdir -p _site
          cp miniapp/index.html _site/
          cp miniapp/data.json  _site/
          cp -r miniapp/icons   _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
