name: Deploy mini app

# Публикует miniapp/ на GitHub Pages и заодно обновляет расписание с edupage.
on:
  push:
    branches: [main]
  # Регулярные сборки выключены: расписание пересобирает сам бот на хостинге,
  # раз в полчаса. Публикация при отправке кода остаётся - иначе запасной
  # адрес на Pages протух бы вместе с данными.
  # schedule:
  #   - cron: "0 */6 * * *"
  workflow_dispatch:           # и кнопка «запустить вручную»

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Тянет актуальную неделю с ttpu.edupage.org и перезаписывает miniapp/data.json.
      # Если edupage недоступен — сайт всё равно публикуем (со старыми данными),
      # но сборку в конце заваливаем: иначе поломка живёт незамеченной месяцами,
      # как это и случилось в сентябре. pipefail обязателен — без него код
      # возврата берётся у tee, и падение python осталось бы «успехом».
      - name: Обновить расписание
        id: refresh
        continue-on-error: true
        run: |
          set -o pipefail
          python miniapp/build_data.py 2>&1 | tee refresh.log

      # В публикацию кладём только сам сайт, без скрипта сборки
      - name: Собрать папку сайта
        run: |
          mkdir -p _site
          cp miniapp/index.html _site/
          cp miniapp/diag.html  _site/
          cp miniapp/data.json  _site/
          cp miniapp/sw.js      _site/
          cp miniapp/icon-*.png _site/
          cp miniapp/logo*.png  _site/
          cp miniapp/manifest.json _site/
          cp -r miniapp/icons   _site/

      # Журналы Actions не прочитать без доступа к репозиторию, поэтому кладём
      # итог рядом с сайтом: по адресу /build-status.json видно, когда была
      # сборка, обновились ли данные и с какой ошибкой, если нет.
      - name: Записать статус сборки
        if: always()
        env:
          OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          python -c "
          import json, datetime, os, pathlib
          d = json.load(open('miniapp/data.json', encoding='utf-8'))
          log = pathlib.Path('refresh.log')
          json.dump({
              'built': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              'refresh': os.environ['OUTCOME'],
              'data_updated': d.get('updated'),
              'week': d.get('week'),
              'log': log.read_text(encoding='utf-8', errors='replace')[-2000:] if log.exists() else '',
          }, open('_site/build-status.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # Последним шагом, уже после публикации. Красным горим не на каждой
      # неудаче, а когда данные реально протухли: с серверов GitHub соединение
      # с edupage иногда отваливается по таймауту, и письмо на каждый такой
      # случай быстро приучило бы не обращать внимания на красный значок —
      # ровно та болезнь, от которой мы лечим.
      - name: Сообщить, если расписание давно не обновлялось
        if: always()
        run: |
          python -c "
          import json, datetime, sys
          d = json.load(open('miniapp/data.json', encoding='utf-8'))
          t = datetime.datetime.strptime(d['updated'], '%Y-%m-%d %H:%M UTC').replace(tzinfo=datetime.timezone.utc)
          age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 3600
          print('возраст опубликованных данных: %.1f ч' % age)
          if age > 24:
              print('::error::Расписание не обновлялось больше суток - сборщик не достучался до edupage')
          sys.exit(1 if age > 24 else 0)
          "
